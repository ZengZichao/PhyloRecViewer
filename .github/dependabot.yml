# Dependabot keeps the three dependency ecosystems current without a human
# remembering to check. A bump is reviewed like any other pull request: CI must be
# green (lint, typecheck, tests, web build) and, for runtime dependencies, someone
# runs `npm run tauri dev` before merging — see CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    # Collect the weekly patch/minor bumps into a single PR rather than many
    # independent ones. Major bumps stay as individual PRs so one incompatible
    # major cannot poison the whole batch — typescript-eslint 8 caps its peer
    # at typescript <6.1.0, which is exactly what sank the grouped-bump PRs of
    # 2026-09-29.
    groups:
      npm-minor-and-patch:
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    # typescript-eslint 8.x declares peer typescript >=4.8.4 <6.1.0, so a
    # typescript@7 bump can never install (npm ERESOLVE). Silence majors until
    # typescript-eslint ships TS 7 support, then delete this block.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
