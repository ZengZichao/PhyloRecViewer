name: CodeQL

# Security analysis of the web layer and the Tauri Rust shell. Results land
# under Security -> Code scanning. Rust runs with `build-mode: none`, so no
# Tauri build is required for the analysis. Weekly cadence is on top of the
# push/PR triggers so drift shows up even on quiet weeks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

# Least privilege; only the security-events upload needs write.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
